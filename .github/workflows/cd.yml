name: CD - Deploy to Kubernetes

on:
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Deployment Environment'
        required: true
        default: 'production'

jobs:
  deploy:
    name: Deploy to Kubernetes Cluster
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.28.2'

      - name: Configure Kubernetes Context via Secrets
        uses: azure/k8s-set-context@v3
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBECONFIG }}

      - name: Apply Kubernetes Namespace & ConfigMaps
        run: |
          kubectl apply -f k8s/00-namespace.yaml
          kubectl apply -f k8s/01-configmaps-secrets.yaml

      - name: Deploy Microservices
        run: |
          kubectl apply -f k8s/04-microservices.yaml
          kubectl apply -f k8s/05-hpa.yaml
          kubectl apply -f k8s/06-ingress.yaml

      - name: Verify Rollout Status
        run: |
          kubectl rollout status deployment/api-gateway -n ecommerce --timeout=120s
          kubectl rollout status deployment/order-service -n ecommerce --timeout=120s
          kubectl rollout status deployment/inventory-service -n ecommerce --timeout=120s
          kubectl rollout status deployment/payment-service -n ecommerce --timeout=120s
