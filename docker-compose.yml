version: '3.8'

services:
  # =========================================================================
  # INFRASTRUCTURE: DATABASES & MESSAGE BROKER
  # =========================================================================
  postgres:
    image: postgres:15-alpine
    container_name: ecommerce-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ecommerce_order_db
    ports:
      - "5432:5432"
    volumes:
      - ./init-scripts/init-postgres.sql:/docker-entrypoint-initdb.d/init-postgres.sql
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ecommerce-network

  mongodb:
    image: mongo:6.0
    container_name: ecommerce-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ecommerce-network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: ecommerce-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - ecommerce-network

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: ecommerce-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - ecommerce-network

  # =========================================================================
  # OBSERVABILITY: ZIPKIN & PROMETHEUS
  # =========================================================================
  zipkin:
    image: openzipkin/zipkin:latest
    container_name: ecommerce-zipkin
    ports:
      - "9411:9411"
    networks:
      - ecommerce-network

  prometheus:
    image: prom/prometheus:latest
    container_name: ecommerce-prometheus
    ports:
      - "9090:9090"
    networks:
      - ecommerce-network

  # =========================================================================
  # SPRING CLOUD INFRASTRUCTURE
  # =========================================================================
  service-registry:
    build:
      context: ./service-registry
    container_name: ecommerce-service-registry
    ports:
      - "8761:8761"
    networks:
      - ecommerce-network

  config-server:
    build:
      context: ./config-server
    container_name: ecommerce-config-server
    depends_on:
      - service-registry
    ports:
      - "8888:8888"
    environment:
      EUREKA_SERVER_URL: http://service-registry:8761/eureka/
      SPRING_PROFILES_ACTIVE: native
    networks:
      - ecommerce-network

  api-gateway:
    build:
      context: ./api-gateway
    container_name: ecommerce-api-gateway
    depends_on:
      - service-registry
      - config-server
    ports:
      - "8080:8080"
    environment:
      EUREKA_SERVER_URL: http://service-registry:8761/eureka/
      CONFIG_SERVER_URL: http://config-server:8888
      JWT_SECRET: zaalima-developers-distributed-ecommerce-super-secret-key-256bit
    networks:
      - ecommerce-network

  # =========================================================================
  # CORE DOMAIN MICROSERVICES
  # =========================================================================
  product-service:
    build:
      context: ./product-service
    container_name: ecommerce-product-service
    depends_on:
      - mongodb
      - service-registry
      - config-server
    ports:
      - "8081:8081"
    environment:
      EUREKA_SERVER_URL: http://service-registry:8761/eureka/
      CONFIG_SERVER_URL: http://config-server:8888
      MONGODB_URI: mongodb://mongodb:27017/ecommerce_product_db
    networks:
      - ecommerce-network

  order-service:
    build:
      context: ./order-service
    container_name: ecommerce-order-service
    depends_on:
      - postgres
      - kafka
      - service-registry
      - config-server
    ports:
      - "8082:8082"
    environment:
      EUREKA_SERVER_URL: http://service-registry:8761/eureka/
      CONFIG_SERVER_URL: http://config-server:8888
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ecommerce_order_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    networks:
      - ecommerce-network

  inventory-service:
    build:
      context: ./inventory-service
    container_name: ecommerce-inventory-service
    depends_on:
      - postgres
      - kafka
      - service-registry
      - config-server
    ports:
      - "8083:8083"
    environment:
      EUREKA_SERVER_URL: http://service-registry:8761/eureka/
      CONFIG_SERVER_URL: http://config-server:8888
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ecommerce_inventory_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    networks:
      - ecommerce-network

  payment-service:
    build:
      context: ./payment-service
    container_name: ecommerce-payment-service
    depends_on:
      - postgres
      - kafka
      - service-registry
      - config-server
    ports:
      - "8084:8084"
    environment:
      EUREKA_SERVER_URL: http://service-registry:8761/eureka/
      CONFIG_SERVER_URL: http://config-server:8888
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ecommerce_payment_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    networks:
      - ecommerce-network

  notification-service:
    build:
      context: ./notification-service
    container_name: ecommerce-notification-service
    depends_on:
      - kafka
      - service-registry
      - config-server
    ports:
      - "8085:8085"
    environment:
      EUREKA_SERVER_URL: http://service-registry:8761/eureka/
      CONFIG_SERVER_URL: http://config-server:8888
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    networks:
      - ecommerce-network

  # =========================================================================
  # FRONTEND CONTROL CENTER
  # =========================================================================
  frontend:
    build:
      context: ./frontend
    container_name: ecommerce-frontend
    depends_on:
      - api-gateway
    ports:
      - "3000:3000"
    networks:
      - ecommerce-network

networks:
  ecommerce-network:
    driver: bridge

volumes:
  postgres_data:
  mongodb_data:
