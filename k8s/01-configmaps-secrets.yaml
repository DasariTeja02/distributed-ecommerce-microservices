apiVersion: v1
kind: ConfigMap
metadata:
  name: ecommerce-config
  namespace: ecommerce-prod
data:
  EUREKA_SERVER_URL: "http://service-registry:8761/eureka/"
  CONFIG_SERVER_URL: "http://config-server:8888"
  KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
  MONGODB_URI: "mongodb://mongodb:27017/ecommerce_product_db"
  POSTGRES_HOST: "postgres"
  POSTGRES_PORT: "5432"
---
apiVersion: v1
kind: Secret
metadata:
  name: ecommerce-secrets
  namespace: ecommerce-prod
type: Opaque
stringData:
  JWT_SECRET: "zaalima-developers-distributed-ecommerce-super-secret-key-256bit"
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "postgres_secure_prod_password"
